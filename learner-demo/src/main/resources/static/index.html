<!doctype html>
<html lang="en" ng-app="learnerApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring Boot + Angular (Starter Demo)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4" ng-controller="LearnerController as vm">
  <h1 class="mb-3">Spring Boot + Angular Learning Demo</h1>
  <p class="text-muted">This is a beginner-friendly version of the Baeldung flow: list data + add data via REST.</p>

  <div class="card mb-4">
    <div class="card-header">Add Learner</div>
    <div class="card-body">
      <form ng-submit="vm.addLearner()" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Name</label>
          <input class="form-control" ng-model="vm.form.name" required />
        </div>
        <div class="col-md-5">
          <label class="form-label">Track</label>
          <input class="form-control" ng-model="vm.form.track" required />
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" type="submit">Save Learner</button>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span>Learners</span>
      <button class="btn btn-outline-secondary btn-sm" ng-click="vm.loadLearners()">Refresh</button>
    </div>
    <div class="card-body p-0">
      <table class="table table-striped mb-0" ng-if="vm.learners.length > 0">
        <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Track</th>
        </tr>
        </thead>
        <tbody>
        <tr ng-repeat="learner in vm.learners">
          <td>{{ learner.id }}</td>
          <td>{{ learner.name }}</td>
          <td>{{ learner.track }}</td>
        </tr>
        </tbody>
      </table>
      <p class="p-3 mb-0" ng-if="vm.learners.length === 0">No learners found yet.</p>
    </div>
  </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
